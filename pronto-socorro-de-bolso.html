<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="description" content="Pronto-Socorro de Bolso: orientações de primeiros socorros passo a passo. Projeto FMU Tech, ODS 3.">
<title>Pronto-Socorro de Bolso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. TOKENS DE DESIGN (tema claro é o padrão)
   ========================================================= */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF2; --ink:#13203A; --muted:#536079;
  --line:#D6DCE5; --red:#C8102E; --red-text:#B10E28; --red-soft:#FCE9EC; --on-red:#FFFFFF;
  --green:#0B7A55; --green-soft:#E2F3EB; --amber:#9A5B00; --amber-soft:#FDF0D8;
  --blue:#1E63A8; --blue-soft:#E3EEF9; --violet:#5E45B0; --violet-soft:#EEEAFA;
  --focus:#1D5FD6; --shadow:0 1px 2px rgba(19,32,58,.06),0 6px 18px rgba(19,32,58,.07);
  --header-bg:rgba(243,245,248,.88);
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C131F; --surface:#141D2C; --surface-2:#1B2638; --ink:#E9EFF7; --muted:#9BA9BE;
    --line:#29364D; --red:#E0303F; --red-text:#FF7D88; --red-soft:#3A1820; --on-red:#FFFFFF;
    --green:#4CCB98; --green-soft:#0F2F28; --amber:#F2B544; --amber-soft:#362A10;
    --blue:#6FB1F2; --blue-soft:#132A42; --violet:#B3A0F5; --violet-soft:#241D40;
    --focus:#7FB2FF; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
    --header-bg:rgba(12,19,31,.86);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C131F; --surface:#141D2C; --surface-2:#1B2638; --ink:#E9EFF7; --muted:#9BA9BE;
  --line:#29364D; --red:#E0303F; --red-text:#FF7D88; --red-soft:#3A1820; --on-red:#FFFFFF;
  --green:#4CCB98; --green-soft:#0F2F28; --amber:#F2B544; --amber-soft:#362A10;
  --blue:#6FB1F2; --blue-soft:#132A42; --violet:#B3A0F5; --violet-soft:#241D40;
  --focus:#7FB2FF; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  --header-bg:rgba(12,19,31,.86);
  color-scheme:dark;
}

/* =========================================================
   2. BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;
  background:var(--header-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--font-display);line-height:1.05;margin:0;letter-spacing:.005em}

/* =========================================================
   3. CABEÇALHO
   ========================================================= */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header-bg);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:980px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--red);display:grid;place-items:center;color:var(--on-red)}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:1.45rem;line-height:1}
.brand-name small{display:block;font-family:var(--font-body);font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:0;margin-top:2px}
.theme-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:7px 12px 7px 9px;cursor:pointer;font-size:.9rem}
.theme-btn:hover{border-color:var(--muted)}
.call-mini{display:flex;align-items:center;gap:6px;background:var(--red);color:var(--on-red);text-decoration:none;
  border-radius:999px;padding:7px 14px 7px 11px;font-weight:700;font-size:.95rem}

/* =========================================================
   4. LAYOUT PRINCIPAL
   ========================================================= */
main{max-width:980px;margin:0 auto;padding:18px 18px calc(110px + env(safe-area-inset-bottom,0px))}
.view-title{font-size:2.1rem;font-weight:800;margin:6px 0 4px}
.view-lead{color:var(--muted);margin:0 0 18px;max-width:62ch}

/* ---------- Bloco SOS (elemento de destaque) ---------- */
.sos{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:22px}
.sos-call{position:relative;display:flex;align-items:center;gap:18px;text-decoration:none;background:var(--red);
  color:var(--on-red);border-radius:22px;padding:20px 22px;overflow:hidden;min-height:118px}
.sos-call::after{content:"";position:absolute;right:-40px;top:50%;width:220px;height:220px;transform:translateY(-50%);
  border-radius:50%;border:26px solid rgba(255,255,255,.10)}
.sos-num{font-family:var(--font-display);font-weight:800;font-size:4.6rem;line-height:.85;letter-spacing:-.01em}
.sos-text{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
.sos-text strong{font-size:1.2rem}
.sos-text span{opacity:.92;font-size:.95rem}
.sos-ring{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;position:relative;z-index:1}
.sos-ring .icon{width:32px;height:32px}
.sos-ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.sos-side{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sos-alt{display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-decoration:none;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-height:96px}
.sos-alt b{font-family:var(--font-display);font-size:1.35rem;line-height:1.05}
.sos-alt span{color:var(--muted);font-size:.88rem;line-height:1.35}
.sos-alt .icon{color:var(--red-text)}
@media (min-width:760px){.sos{grid-template-columns:1.35fr 1fr}.sos-call{min-height:100%}}

/* ---------- Busca e filtros ---------- */
.search{position:relative;margin-bottom:14px}
.search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 14px 14px 46px;font-size:1.05rem}
.search input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.93rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- Grade de situações ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;gap:14px;align-items:flex-start;text-align:left;text-decoration:none;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:14px;position:relative}
.tile:hover{border-color:var(--muted)}
.tile-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--c-soft);color:var(--c)}
.tile h3{font-size:1.32rem;font-weight:700;margin-bottom:3px}
.tile p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.4}
.tile .flag{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.empty a{color:var(--red-text);font-weight:700}

.cat-coracao{--c:var(--red-text);--c-soft:var(--red-soft)}
.cat-respiracao{--c:var(--blue);--c-soft:var(--blue-soft)}
.cat-ferimentos{--c:var(--amber);--c-soft:var(--amber-soft)}
.cat-acidentes{--c:var(--violet);--c-soft:var(--violet-soft)}

.note{margin-top:28px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:.88rem;max-width:70ch}
.note strong{color:var(--ink)}

/* =========================================================
   5. GUIA (página de cada situação)
   ========================================================= */
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:.95rem;margin-bottom:10px;padding:6px 0}
.g-head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.g-head .tile-ic{width:60px;height:60px;border-radius:16px}
.g-head .tile-ic .icon{width:32px;height:32px}
.g-head h1{font-size:2.3rem;font-weight:800}
.g-head p{margin:4px 0 0;color:var(--muted)}
.g-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);
  border-radius:12px;padding:11px 16px;cursor:pointer;text-decoration:none;font-weight:700;font-size:.98rem}
.btn:hover{border-color:var(--muted)}
.btn-red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn-red:hover{filter:brightness(1.06);border-color:var(--red)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn[aria-pressed="true"] .icon{fill:currentColor}

.alert{border-radius:16px;padding:14px 16px;margin-bottom:14px;border:1.5px solid}
.alert h2{font-size:1.3rem;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.alert ul{margin:0;padding-left:20px}
.alert li{margin:3px 0}
.alert-red{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.alert-red h2{color:var(--red-text)}
.alert-amber{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
.alert-amber h2{color:var(--amber)}
.alert-green{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.alert-green h2{color:var(--green)}

.g-cols{display:grid;gap:14px}
@media (min-width:860px){.g-cols{grid-template-columns:1.55fr 1fr;align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.panel h2{font-size:1.45rem;margin-bottom:10px}
.signs{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.signs li{background:var(--surface-2);border-radius:10px;padding:6px 11px;font-size:.93rem}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0;padding-top:4px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--font-display);font-weight:800;font-size:1.5rem;
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--c-soft);color:var(--c)}
.steps b{display:block;font-size:1.05rem;margin-bottom:2px}
.steps span{color:var(--muted)}
.dont li::marker{color:var(--red-text)}
.tip{font-size:.95rem}
.source{color:var(--muted);font-size:.82rem;margin-top:14px}

/* ---------- Modo passo a passo ---------- */
.focus{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px))}
.focus.open{display:flex}
.focus-top{display:flex;align-items:center;gap:12px;max-width:720px;width:100%;margin:0 auto}
.bars{display:flex;gap:6px;flex:1}
.bars i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.bars i.on{background:var(--red)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.focus-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:720px;width:100%;margin:0 auto}
.focus-n{font-family:var(--font-display);font-weight:800;font-size:6rem;line-height:.9;color:var(--red-text)}
.focus-t{font-family:var(--font-display);font-weight:700;font-size:2.4rem;line-height:1.05;margin:8px 0 14px}
.focus-d{font-size:1.25rem;line-height:1.5;max-width:40ch}
.focus-nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;max-width:720px;width:100%;margin:0 auto}
.focus-nav .btn{padding:16px;font-size:1.1rem}

/* =========================================================
   6. TREINADOR DE RCP
   ========================================================= */
.cpr{display:grid;gap:16px}
@media (min-width:860px){.cpr{grid-template-columns:1.1fr 1fr;align-items:start}}
.cpr-stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;width:100%;max-width:420px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 8px;cursor:pointer;font-size:.92rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dial{position:relative;width:min(300px,72vw);aspect-ratio:1;display:grid;place-items:center}
.dial-ring{position:absolute;inset:0;border-radius:50%;border:14px solid var(--red-soft)}
.dial-core{width:72%;aspect-ratio:1;border-radius:50%;background:var(--red);color:var(--on-red);display:flex;flex-direction:column;
  align-items:center;justify-content:center;transition:transform .08s ease-out}
.dial-core.beat{transform:scale(.88)}
.dial-count{font-family:var(--font-display);font-weight:800;font-size:5.4rem;line-height:.9}
.dial-label{font-size:.95rem;opacity:.92}
.dial.vent .dial-core{background:var(--blue)}
.dial.vent .dial-ring{border-color:var(--blue-soft)}
.cpr-stats{display:flex;gap:26px;justify-content:center}
.cpr-stats div{text-align:center}
.cpr-stats b{display:block;font-family:var(--font-display);font-size:2rem;line-height:1}
.cpr-stats span{font-size:.82rem;color:var(--muted)}
.cpr-msg{min-height:1.6em;text-align:center;font-weight:700;color:var(--red-text)}
.cpr-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cpr-ctrl .btn{min-width:150px;padding:14px 18px;font-size:1.05rem}
.toggle{display:flex;align-items:center;gap:10px;font-size:.95rem;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--red)}
@media (prefers-reduced-motion:reduce){
  .dial-core{transition:none}.dial-core.beat{transform:none;filter:brightness(1.25)}
  .sos-ring::before{animation:none}
}

/* =========================================================
   7. CONTATOS, FICHA, SALVOS
   ========================================================= */
.contacts{display:grid;gap:10px}
.contact{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none}
.contact:hover{border-color:var(--muted)}
.contact-num{font-family:var(--font-display);font-weight:800;font-size:2.1rem;min-width:92px;color:var(--c)}
.contact-num.long{font-size:1.35rem}
.contact b{display:block;font-size:1.05rem}
.contact span{color:var(--muted);font-size:.9rem}
.contact .icon{margin-left:auto;color:var(--muted)}

.form{display:grid;gap:14px;max-width:640px}
.field label{display:block;font-weight:700;margin-bottom:5px}
.field small{display:block;color:var(--muted);font-size:.85rem;margin-top:4px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 13px;font-size:1rem}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--focus);outline:none}
.row2{display:grid;gap:14px}
@media (min-width:600px){.row2{grid-template-columns:1fr 1fr}}
.saved-ok{color:var(--green);font-weight:700;min-height:1.5em}

/* =========================================================
   8. NAVEGAÇÃO INFERIOR
   ========================================================= */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-inner{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;text-decoration:none;color:var(--muted);font-size:.76rem}
.tab[aria-current="page"]{color:var(--red-text);font-weight:700}
.tab[aria-current="page"] .icon{stroke-width:2.4}
.tab-rcp .tab-dot{width:44px;height:30px;border-radius:999px;background:var(--red);color:var(--on-red);display:grid;place-items:center;margin-top:-2px}
.tab-rcp .tab-dot .icon{width:20px;height:20px}
.tab-rcp[aria-current="page"] .tab-dot{box-shadow:0 0 0 3px var(--red-soft)}

.disclaimer{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:.86rem;color:var(--muted);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.disclaimer .icon{width:20px;height:20px;color:var(--amber);margin-top:2px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#inicio" aria-label="Pronto-Socorro de Bolso, início">
      <span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z" fill="currentColor" stroke="none"/></svg></span>
      <span class="brand-name">Pronto-Socorro de Bolso<small>Primeiros socorros passo a passo</small></span>
    </a>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Mudar tema"></button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<nav class="tabbar" aria-label="Navegação principal">
  <div class="tabbar-inner" id="tabbar"></div>
</nav>

<div class="focus" id="focus" role="dialog" aria-modal="true" aria-labelledby="focusTitle">
  <div class="focus-top">
    <div class="bars" id="focusBars"></div>
    <button class="icon-btn" id="focusClose" type="button" aria-label="Fechar modo passo a passo"></button>
  </div>
  <div class="focus-body" aria-live="polite">
    <div class="focus-n" id="focusN"></div>
    <h2 class="focus-t" id="focusTitle"></h2>
    <p class="focus-d" id="focusD"></p>
  </div>
  <div class="focus-nav">
    <button class="btn" id="focusPrev" type="button">Voltar</button>
    <button class="btn btn-red" id="focusNext" type="button">Próximo passo</button>
  </div>
</div>

<script>
/* =========================================================
   A. ÍCONES (SVG em linha, sem dependências externas)
   ========================================================= */
const IC = {
  heart:'<path d="M20.8 8.6a5 5 0 0 0-8.8-3.2A5 5 0 0 0 3.2 8.6c0 5 8.8 11 8.8 11s8.8-6 8.8-11Z"/><path d="M3.6 12h4l1.5-3 3 6 1.5-3h6.8"/>',
  wind:'<path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h7"/>',

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
let favoritos = new Set(store.get("psb:favoritos", []));
const salvarFavoritos = () => store.set("psb:favoritos", [...favoritos]);

const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const porId = id => GUIAS.find(g => g.id === id);

/* =========================================================
   D. TEMA CLARO / ESCURO / AUTOMÁTICO
   ========================================================= */
const TEMAS = {auto:{rot:"Automático",ic:"auto"}, light:{rot:"Claro",ic:"sun"}, dark:{rot:"Escuro",ic:"moon"}};
let tema = store.get("psb:tema", "auto");
function aplicarTema(){
  const root = document.documentElement;
  if (tema === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", tema);
  const b = document.getElementById("themeBtn");
  b.innerHTML = icon(TEMAS[tema].ic) + `<span>${TEMAS[tema].rot}</span>`;
  b.setAttribute("aria-label", `Tema: ${TEMAS[tema].rot}. Toque para mudar`);
  const escuro = tema === "dark" || (tema === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').content = escuro ? "#0C131F" : "#F3F5F8";
}
document.getElementById("themeBtn").addEventListener("click", () => {
  tema = tema === "auto" ? "light" : tema === "light" ? "dark" : "auto";
  store.set("psb:tema", tema); aplicarTema();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", aplicarTema);

function rota(){
  const h = (location.hash || "#inicio").slice(1);
  pararRCP();
  const app = document.getElementById("app");
  if (porId(h)) telaGuia(app, porId(h));
  else if (h === "rcp") telaRCP(app);

}

  return `<div class="field"><label for="${c.id}">${c.rot}</label>${input}${c.ajuda ? `<small>${c.ajuda}</small>` : ""}</div>`;
}

/* =========================================================
   G. MODO “UM PASSO POR VEZ”
   ========================================================= */
const foco = {el:document.getElementById("focus"), g:null, i:0, origem:null};
document.getElementById("focusClose").innerHTML = icon("close");
function abrirFoco(g){
  foco.g = g; foco.i = 0; foco.origem = document.activeElement;
  foco.el.classList.add("open"); document.body.style.overflow = "hidden";
  desenharFoco(); document.getElementById("focusNext").focus();
}
function fecharFoco(){
  foco.el.classList.remove("open"); document.body.style.overflow = "";
  foco.origem?.focus();
}
function desenharFoco(){
  const {g,i} = foco, total = g.passos.length;
  document.getElementById("focusBars").innerHTML = g.passos.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("");
  document.getElementById("focusN").textContent = i + 1;
  document.getElementById("focusTitle").textContent = g.passos[i][0];
  document.getElementById("focusD").textContent = g.passos[i][1];
  document.getElementById("focusPrev").disabled = i === 0;
  document.getElementById("focusPrev").style.opacity = i === 0 ? .4 : 1;
  document.getElementById("focusNext").innerHTML = i === total - 1 ? "Concluir" : "Próximo passo";
}
document.getElementById("focusNext").addEventListener("click", () => {
  if (foco.i < foco.g.passos.length - 1){ foco.i++; desenharFoco(); } else fecharFoco();
});
document.getElementById("focusPrev").addEventListener("click", () => { if (foco.i > 0){ foco.i--; desenharFoco(); } });
document.getElementById("focusClose").addEventListener("click", fecharFoco);
document.addEventListener("keydown", e => {
  if (!foco.el.classList.contains("open")) return;
  if (e.key === "Escape") fecharFoco();
  if (e.key === "ArrowRight") document.getElementById("focusNext").click();
  if (e.key === "ArrowLeft") document.getElementById("focusPrev").click();
});

/* =========================================================
   H. GUIA DE COMPRESSÕES (metrônomo de RCP a 110/min)
   ========================================================= */
const BPM = 110, INTERVALO = 60000 / BPM;
const rcp = {rodando:false, modo:"continuo", som:true, contagem:0, total:0, inicio:0, acumulado:0, beat:null, relogio:null, vent:null, wake:null, audio:null};

function telaRCP(app){
  app.innerHTML = `
    <h1 class="view-title">Guia de compressões</h1>
    <p class="view-lead">Comprima o centro do peito a cada batida: 5 a 6 cm de profundidade, deixando o peito voltar. Antes de começar, ligue 192.</p>
    <div class="cpr">
      <div class="cpr-stage">
        <div class="seg" role="group" aria-label="Modo">
          <button type="button" data-modo="continuo" aria-pressed="${rcp.modo==="continuo"}">Só compressões</button>
          <button type="button" data-modo="30x2" aria-pressed="${rcp.modo==="30x2"}">30 + 2 ventilações</button>
        </div>
        <div class="dial" id="dial">
          <div class="dial-ring"></div>
          <div class="dial-core" id="dialCore">
            <span class="dial-count" id="dialCount">0</span>
            <span class="dial-label" id="dialLabel">Toque em Iniciar</span>
          </div>
        </div>
        <div class="cpr-msg" id="cprMsg" role="status" aria-live="assertive"></div>
        <div class="cpr-stats">
          <div><b id="statTempo">00:00</b><span>tempo</span></div>
          <div><b id="statTotal">0</b><span>compressões</span></div>
          <div><b>${BPM}</b><span>por minuto</span></div>
        </div>
        <div class="cpr-ctrl">
          <button class="btn btn-red" id="cprStart" type="button">${icon("play")} Iniciar</button>
          <button class="btn" id="cprReset" type="button">Zerar</button>
        </div>
        <label class="toggle"><input type="checkbox" id="cprSom" ${rcp.som ? "checked" : ""}> Som de batida</label>
        <a class="btn btn-red" href="tel:192" style="width:100%;max-width:420px">${icon("phone")} Ligar 192</a>
      </div>
      <div class="panel cat-coracao">
        <h2>Lembretes</h2>
        <ol class="steps">
          <li><div><b>Mãos no centro do peito</b><span>Uma sobre a outra, dedos entrelaçados, braços esticados.</span></div></li>
          <li><div><b>Use o peso do corpo</b><span>Ombros acima das mãos. Quem comprime com os braços cansa rápido.</span></div></li>
          <li><div><b>Deixe o peito voltar</b><span>É nessa volta que o coração se enche de sangue.</span></div></li>
          <li><div><b>Reveze a cada 2 minutos</b><span>O app avisa. A troca deve levar poucos segundos.</span></div></li>
          <li><div><b>Chegou um DEA?</b><span>Ligue o aparelho e siga a voz dele. Pare as compressões só quando ele pedir.</span></div></li>
        </ol>
        <p class="source">O modo 30 + 2 é para quem tem treinamento em ventilação. Sem treinamento, use só compressões.</p>
      </div>
    </div>`;

  app.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    rcp.modo = b.dataset.modo;
    app.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    rcp.contagem = 0; atualizarDial();
  }));
  app.querySelector("#cprStart").addEventListener("click", () => rcp.rodando ? pausarRCP() : iniciarRCP());
  app.querySelector("#cprReset").addEventListener("click", () => {
    pararRCP(); rcp.contagem = 0; rcp.total = 0; rcp.acumulado = 0; atualizarDial(); atualizarTempo();
    document.getElementById("cprMsg").textContent = "";
  });
  app.querySelector("#cprSom").addEventListener("change", e => rcp.som = e.target.checked);
  atualizarDial(); atualizarTempo();
}

function clique(forte){
  if (!rcp.som) return;
  try{
    rcp.audio = rcp.audio || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = rcp.audio, o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = forte ? 1320 : 880; o.type = "square";
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.07);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.08);
  }catch(e){}
}

async function iniciarRCP(){
  rcp.rodando = true; rcp.inicio = performance.now();
  if (rcp.modo === "30x2" && rcp.contagem >= 30) rcp.contagem = 0;
  try{ rcp.audio?.resume(); }catch(e){}
  try{ if ("wakeLock" in navigator) rcp.wake = await navigator.wakeLock.request("screen"); }catch(e){}
  const btn = document.getElementById("cprStart");
  if (btn) btn.innerHTML = icon("pause") + " Pausar";
  batida();
  rcp.beat = setInterval(batida, INTERVALO);
  rcp.relogio = setInterval(atualizarTempo, 250);
}
function pausarRCP(){
  rcp.acumulado += rcp.rodando ? performance.now() - rcp.inicio : 0;
  limparTimers();
  rcp.rodando = false;
  const btn = document.getElementById("cprStart");
  if (btn) btn.innerHTML = icon("play") + " Continuar";
  document.getElementById("dialLabel").textContent = "Pausado";
}
function pararRCP(){ if (rcp.rodando) pausarRCP(); limparTimers(); }
function limparTimers(){
  clearInterval(rcp.beat); clearInterval(rcp.relogio); clearTimeout(rcp.vent);
  rcp.beat = rcp.relogio = rcp.vent = null;
  try{ rcp.wake?.release(); }catch(e){} rcp.wake = null;
  document.getElementById("dial")?.classList.remove("vent");
}
function batida(){
  rcp.contagem++; rcp.total++;
  const limite = rcp.modo === "30x2" ? 30 : null;
  clique(limite && rcp.contagem === limite);
  try{ navigator.vibrate?.(40); }catch(e){}
  const core = document.getElementById("dialCore");
  if (core){ core.classList.add("beat"); setTimeout(() => core.classList.remove("beat"), 110); }
  atualizarDial();
  if (limite && rcp.contagem >= limite){
    clearInterval(rcp.beat); rcp.beat = null;
    const dial = document.getElementById("dial");
    dial?.classList.add("vent");
    document.getElementById("dialCount").textContent = "2";
    document.getElementById("dialLabel").textContent = "ventilações";
    rcp.vent = setTimeout(() => {
      if (!rcp.rodando) return;
      dial?.classList.remove("vent"); rcp.contagem = 0;
      batida(); rcp.beat = setInterval(batida, INTERVALO);
    }, 5000);
  }
}
function atualizarDial(){
  const c = document.getElementById("dialCount"), l = document.getElementById("dialLabel");
  if (!c) return;
  c.textContent = rcp.modo === "30x2" ? rcp.contagem : (rcp.contagem % 1000);
  l.textContent = rcp.rodando ? (rcp.modo === "30x2" ? "de 30" : "comprima") : (rcp.total ? "Pausado" : "Toque em Iniciar");
  const t = document.getElementById("statTotal"); if (t) t.textContent = rcp.total;
}
let ultimoAviso = 0;
function atualizarTempo(){
  const ms = rcp.acumulado + (rcp.rodando ? performance.now() - rcp.inicio : 0);
  const s = Math.floor(ms / 1000);
  const el = document.getElementById("statTempo");
  if (el) el.textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
  const ciclo = Math.floor(s / 120);
  const msg = document.getElementById("cprMsg");
  if (rcp.rodando && ciclo > 0 && ciclo !== ultimoAviso){
    ultimoAviso = ciclo;
    if (msg) msg.textContent = "2 minutos: se houver ajuda, troque quem está comprimindo.";
    setTimeout(() => { if (msg) msg.textContent = ""; }, 8000);
  }
  if (s === 0) ultimoAviso = 0;
}
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && rcp.rodando && !rcp.wake){
    try{ rcp.wake = await navigator.wakeLock?.request("screen"); }catch(e){}
  }
});

/* =========================================================
   I. INICIALIZAÇÃO
   ========================================================= */
aplicarTema();
rota();
</script>
</body>
</html>
